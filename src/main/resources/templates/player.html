<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrot - Player</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          th:href="@{/css/carrot.css}">
    <link rel="stylesheet"
          th:href="@{/css/index.css}">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <script src="https://unpkg.com/htmx.org"></script>
    <script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
    <script th:src="@{/js/websocket.js}"></script>
</head>

<body>
    <div class="app-container">
        <div class="container">
            <div class="row justify-content-center mt-2">
                <div class="row">
                    <div class="col-md-5">
                        <h3 class="display-3 fw-bold text-white">
                            🥕 Carrot
                        </h3>
                    </div>
                    <div class="col-md-6 text-center title_text">
                        <span class="text-white">
                            Plataforma interativa de perguntas e respostas em tempo real.
                        </span>
                    </div>
                </div>
                <div class="hero-card" id="hero-card" data-view="player">
                    <div th:replace="~{${content}}">
                        <p>Carregando tela do jogador...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
