<div th:fragment="content" class="player-question-container d-flex flex-column h-100 justify-content-between p-3">

    <div class="text-center mb-2">
        <h5 class="text-white fw-bold mb-1">Selecione sua resposta:</h5>
        <p class="text-muted small mb-0">Toque em um dos botões abaixo</p>
    </div>

    <!-- Container dos 4 Botões Grandes (Grid 2x2) -->
    <div class="flex-grow-1 d-flex flex-column justify-content-center my-auto">
        <div class="answer-grid">

            <!-- Botão Opção 1 -->
            <button type="button"
                    hx-post="/player/answer"
                    hx-ext="json-enc"
                    th:hx-vals="${'{&quot;idJogador&quot;: ' + session.PLAYER_ID + ', &quot;resposta&quot;: 1}'}"
                    hx-target="#answer-feedback"
                    hx-swap="innerHTML"
                    class="btn btn-answer btn-option-1 d-flex align-items-center justify-content-center">
                <span class="fs-1 fw-bold">1</span>
            </button>

            <!-- Botão Opção 2 -->
            <button type="button"
                    hx-post="/player/answer"
                    hx-ext="json-enc"
                    th:hx-vals="${'{&quot;idJogador&quot;: ' + session.PLAYER_ID + ', &quot;resposta&quot;: 2}'}"
                    hx-target="#answer-feedback"
                    hx-swap="innerHTML"
                    class="btn btn-answer btn-option-2 d-flex align-items-center justify-content-center">
                <span class="fs-1 fw-bold">2</span>
            </button>

            <!-- Botão Opção 3 -->
            <button type="button"
                    hx-post="/player/answer"
                    hx-ext="json-enc"
                    th:hx-vals="${'{&quot;idJogador&quot;: ' + session.PLAYER_ID + ', &quot;resposta&quot;: 3}'}"
                    hx-target="#answer-feedback"
                    hx-swap="innerHTML"
                    class="btn btn-answer btn-option-3 d-flex align-items-center justify-content-center">
                <span class="fs-1 fw-bold">3</span>
            </button>

            <!-- Botão Opção 4 -->
            <button type="button"
                    hx-post="/player/answer"
                    hx-ext="json-enc"
                    th:hx-vals="${'{&quot;idJogador&quot;: ' + session.PLAYER_ID + ', &quot;resposta&quot;: 4}'}"
                    hx-target="#answer-feedback"
                    hx-swap="innerHTML"
                    class="btn btn-answer btn-option-4 d-flex align-items-center justify-content-center">
                <span class="fs-1 fw-bold">4</span>
            </button>

        </div>
    </div>

    <div id="answer-feedback" class="text-center mt-2"></div>

    <script>
        document.querySelectorAll('.btn-answer').forEach(button => {
            button.addEventListener('click', function () {
                document.querySelectorAll('.btn-answer').forEach(b => {
                    b.classList.add('disabled');
                    b.style.pointerEvents = 'none';
                    b.style.opacity = '0.4';
                });
                this.style.opacity = '1.0';
                this.style.transform = 'scale(0.96)';
            });
        });
    </script>
</div>
